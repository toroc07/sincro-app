# Stack completo de despacho de emergencias.
#
#   docker compose up --build        levanta db + migraciones + los 3 servicios
#   docker compose down              para; añade -v para borrar la base
#
# Puertos en el host:  web 3000 · audio 4001 · routing 4002 · postgres 5433
# (5433 para no chocar con un postgres local en 5432).

name: sincro-app

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dispatch
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dispatch"]
      interval: 3s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/dispatch?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  routing:
    build:
      context: ./backend
      dockerfile: routing/Dockerfile
    environment:
      PORT: "4002"
    ports:
      - "4002:4002"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4002/health')\""]
      interval: 5s
      timeout: 5s
      retries: 30

  audio:
    build:
      context: .
      target: audio
    environment:
      PORT: "4001"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "4001:4001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_AUDIO_SERVICE_URL: ${NEXT_PUBLIC_AUDIO_SERVICE_URL:-http://localhost:4001}
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/dispatch?sslmode=disable
      DEMO_MODE: ${DEMO_MODE:-true}
      AUDIO_SERVICE_URL: http://audio:4001
      ROUTING_SERVICE_URL: http://routing:4002
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      audio:
        condition: service_started
      routing:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
